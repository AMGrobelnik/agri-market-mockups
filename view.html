<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agri Market — mockup viewer</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;background:#0d1117;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#lab{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;background:rgba(13,17,23,.88);color:#e6edf3;font:13px/1 system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:1px solid #2a313c;white-space:nowrap;display:flex;gap:10px;align-items:center;opacity:1;transition:opacity .4s}
#lab.dim{opacity:.35}
#lab a{color:#58a6ff;text-decoration:none;cursor:pointer}
#lab small{color:#8b949e}
</style>
</head>
<body>
<iframe id="f" title="mockup"></iframe>
<div id="lab"><a id="back" href="index.html">&larr; index</a><span id="txt">loading…</span><small>← → variant · ↑ ↓ page · Esc index</small></div>
<script>
const ORDER = ["landing","live","markets","detail"];
const f = document.getElementById("f"), txt = document.getElementById("txt"), lab = document.getElementById("lab");
const q = new URLSearchParams(location.search);
let pages = {}, page = q.get("p") || "landing", idx = Math.max(0, (parseInt(q.get("v"), 10) || 1) - 1);
let dimT;

function show(){
  const list = pages[page] || [];
  if (!list.length) { txt.textContent = page + " — no variants yet"; f.removeAttribute("src"); return; }
  idx = Math.min(Math.max(idx, 0), list.length - 1);
  const v = list[idx];
  const url = new URL(location.href); url.searchParams.set("p", page); url.searchParams.set("v", idx + 1);
  history.replaceState(null, "", url);
  const cur = f.getAttribute("src");
  if (cur !== v.file) f.src = v.file;
  txt.textContent = page + " v" + v.id + " (" + (idx + 1) + "/" + list.length + ")";
  lab.classList.remove("dim"); clearTimeout(dimT); dimT = setTimeout(() => lab.classList.add("dim"), 2500);
}

function step(d){ const n = (pages[page] || []).length; if (n) { idx = (idx + d + n) % n; show(); } }
function pageStep(d){
  const k = ORDER.indexOf(page);
  for (let i = 1; i <= ORDER.length; i++) {
    const p = ORDER[(k + d * i + ORDER.length * 2) % ORDER.length];
    if ((pages[p] || []).length) { page = p; idx = 0; show(); return; }
  }
}
function onKey(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const m = {ArrowLeft:() => step(-1), ArrowRight:() => step(1), ArrowUp:() => pageStep(-1), ArrowDown:() => pageStep(1), Escape:() => { location.href = "index.html"; }};
  if (m[e.key]) { e.preventDefault(); m[e.key](); }
}
addEventListener("keydown", onKey);
// keys also work while focus is inside the same-origin iframe
f.addEventListener("load", () => { try { f.contentWindow.addEventListener("keydown", onKey); } catch (e) {} });

async function load(){
  try {
    const r = await fetch("manifest.json?t=" + Date.now(), {cache:"no-store"});
    const man = await r.json();
    pages = man.pages || {};
    show();
  } catch (e) { console.warn("manifest load failed", e); txt.textContent = "manifest unavailable"; }
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
