<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>HARVEST · Live v13</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafafa; --fg: #09090b; --fg2: #27272a; --muted: #71717a; --muted2: #a1a1aa; --border: #e4e4e7; --soft: #f4f4f5;
  --yes: #16a34a; --yes-bg: #dcfce7; --no: #dc2626; --no-bg: #fee2e2;
  --glass: rgba(255,255,255,.64); --glass-hi: rgba(255,255,255,.84); --gb: rgba(255,255,255,.9);
  --shadow: 0 0 0 1px rgba(9,9,11,.05), 0 1px 2px rgba(9,9,11,.04), 0 12px 32px -8px rgba(9,9,11,.12);
  --sans: 'Geist', 'Inter', system-ui, -apple-system, sans-serif; --mono: 'Geist Mono', ui-monospace, SFMono-Regular, monospace;
  --r: 14px; --gut: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 var(--sans); color: var(--fg); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(900px 640px at 12% 8%, rgba(187,247,208,.55), transparent 62%),
    radial-gradient(760px 620px at 92% 92%, rgba(254,215,170,.45), transparent 60%),
    radial-gradient(760px 560px at 55% 45%, rgba(224,231,255,.55), transparent 62%);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; cursor: pointer; }
.glass {
  background: var(--glass); border: 1px solid var(--gb); border-radius: var(--r); box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.y { color: var(--yes); } .n { color: var(--no); }

/* stage */
#stage { position: fixed; inset: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
#tip { position: absolute; pointer-events: none; padding: 6px 10px; font-size: 12px; border-radius: 10px; opacity: 0; transform: translate(-50%, calc(-100% - 14px)); transition: opacity .12s; white-space: nowrap; z-index: 5; background: var(--glass-hi); }
#tip.on { opacity: 1; }
#tip b { font-weight: 600; }
#tip .sub { color: var(--muted); font-size: 11px; }

/* nav */
.nav { position: fixed; top: var(--gut); left: var(--gut); right: var(--gut); height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 10px 0 16px; z-index: 20; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .06em; font-size: 15px; white-space: nowrap; }
.logo { width: 22px; height: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.logo i { border-radius: 50%; background: var(--fg); }
.logo i:nth-child(2n) { background: #16a34a; } .logo i:nth-child(5) { background: #f59e0b; }
.live { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--sans); letter-spacing: .04em; color: var(--yes); background: var(--yes-bg); padding: 3px 8px; border-radius: 999px; text-transform: uppercase; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--yes); box-shadow: 0 0 0 0 rgba(22,163,74,.5); animation: ping 1.6s infinite; }
.live.paused { color: var(--muted); background: var(--soft); } .live.paused i { background: var(--muted2); animation: none; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,.55); } 80%, 100% { box-shadow: 0 0 0 7px rgba(22,163,74,0); } }
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 10px; background: rgba(244,244,245,.85); border: 1px solid var(--border); margin: 0 auto; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--muted); border-radius: 7px; white-space: nowrap; transition: color .2s; }
.seg button.on { color: var(--fg); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 7px; background: #fff; box-shadow: 0 1px 2px rgba(9,9,11,.08), 0 0 0 1px rgba(9,9,11,.04); transition: transform .35s cubic-bezier(.3,1.3,.5,1), width .35s cubic-bezier(.3,1.3,.5,1); }
.seg kbd { font: 500 10px var(--mono); color: var(--muted2); margin-left: 6px; }
.stats { display: flex; gap: 20px; }
.stat { display: flex; flex-direction: column; line-height: 1.15; }
.stat span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat b { font: 600 13.5px var(--mono); font-variant-numeric: tabular-nums; }
.right { display: flex; align-items: center; gap: 10px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; color: #3f3f46; background: #fff; border: 1px solid var(--border); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; }
.wallet { font: 600 12.5px var(--mono); padding: 6px 10px; border-radius: 8px; background: var(--fg); color: #fff; white-space: nowrap; }

/* cards */
.card { display: flex; flex-direction: column; min-height: 0; }
.card h2 { font-size: 13px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
.card .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid rgba(228,228,231,.7); }
.sub { color: var(--muted); font-size: 12px; }
.tabs { display: inline-flex; gap: 2px; background: rgba(244,244,245,.9); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: none; font-size: 11.5px; padding: 3px 8px; border-radius: 6px; color: var(--muted); }
.tabs button.on { background: #fff; color: var(--fg); box-shadow: 0 1px 2px rgba(9,9,11,.08); }
.icon-btn { border: 1px solid var(--border); background: #fff; border-radius: 7px; width: 26px; height: 24px; display: inline-grid; place-items: center; font-size: 11px; color: var(--fg2); }

#feed { position: fixed; left: var(--gut); top: 84px; bottom: var(--gut); width: 330px; z-index: 10; }
#feedList { list-style: none; margin: 0; padding: 4px 6px 8px; overflow: auto; flex: 1; scrollbar-width: thin; }
.row { display: grid; grid-template-columns: 30px 1fr auto; gap: 9px; align-items: center; padding: 7px 8px; border-radius: 10px; cursor: pointer; }
.row:hover { background: rgba(244,244,245,.8); }
.row.new { animation: slidein .5s cubic-bezier(.2,.9,.3,1.2); }
.row.user { background: rgba(254,243,199,.6); }
@keyframes slidein { from { opacity: 0; transform: translateY(-10px) scale(.98); background: rgba(220,252,231,.8); } }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; background: #fff; box-shadow: 0 0 0 2px var(--c, #e4e4e7), 0 1px 3px rgba(9,9,11,.1); }
.av.sm { width: 24px; height: 24px; font-size: 12.5px; }
.l1 { font-size: 12.5px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.l1 b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 128px; }
.l2 { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side { font: 600 10px var(--sans); padding: 1px 6px; border-radius: 5px; letter-spacing: .03em; }
.side.yes { color: var(--yes); background: var(--yes-bg); } .side.no { color: var(--no); background: var(--no-bg); }
.amt { font: 600 12px var(--mono); text-align: right; white-space: nowrap; }
.amt small { display: block; font-weight: 400; color: var(--muted2); font-size: 10.5px; }

#right { position: fixed; right: var(--gut); top: 84px; bottom: var(--gut); width: 340px; display: flex; flex-direction: column; gap: 12px; z-index: 10; overflow: auto; scrollbar-width: none; }
#lbList, #hotList { list-style: none; margin: 0; padding: 4px 6px 8px; }
.lb { display: grid; grid-template-columns: 16px 26px 1fr 54px 76px; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; cursor: pointer; transition: background .2s; }
.lb:hover, .lb.sel { background: rgba(244,244,245,.85); }
.lb .rk { font: 500 11px var(--mono); color: var(--muted2); }
.lb .nm { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.lb .pn { font: 600 12px var(--mono); text-align: right; white-space: nowrap; transition: color .3s; }
.lb .pn small { display: block; font-weight: 400; color: var(--muted); font-size: 10.5px; }
.lb .pn.flash { animation: flash .9s; }
@keyframes flash { 0% { background: rgba(254,240,138,.8); } 100% { background: transparent; } }
.hot { display: grid; grid-template-columns: 1fr auto 44px; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 10px; cursor: pointer; }
.hot:hover, .hot.sel { background: rgba(244,244,245,.85); }
.hot .t { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hot .t small { display: block; color: var(--muted); font-size: 11px; }
.pill { font: 600 11.5px var(--mono); padding: 3px 7px; border-radius: 7px; background: #fff; border: 1px solid var(--border); white-space: nowrap; }
.chg { font: 500 11px var(--mono); text-align: right; }

/* overlays on the stage */
#bookbar { position: absolute; z-index: 6; display: none; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; border-radius: 12px; font-size: 12.5px; transform: translateX(-50%); max-width: calc(100vw - 32px); }
#bookbar.on { display: flex; }
#bookbar select { font: 500 12.5px var(--sans); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; background: #fff; max-width: 290px; color: var(--fg); }
#bookbar .lbl { color: var(--muted); white-space: nowrap; }
#hint { position: absolute; z-index: 6; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px; font-size: 12px; color: var(--fg2); display: flex; gap: 12px; align-items: center; white-space: nowrap; }
#hint i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
#hint .m { color: var(--muted); }

/* drawer */
#drawer { position: fixed; right: var(--gut); top: 84px; bottom: var(--gut); width: 384px; z-index: 30; transform: translateX(calc(100% + 40px)); transition: transform .45s cubic-bezier(.2,.9,.25,1); overflow: auto; background: rgba(255,255,255,.78); scrollbar-width: thin; }
#drawer.on { transform: none; }
#drawer .close { position: sticky; top: 10px; float: right; margin: 10px 10px 0 0; z-index: 2; }
.dbody { padding: 18px 18px 22px; }
.over { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.dbody h3 { font-size: 19px; line-height: 1.25; margin: 6px 0 10px; letter-spacing: -.01em; }
.dbody p { color: #3f3f46; font-size: 13px; margin: 8px 0; }
.dbody h4 { font-size: 12px; font-weight: 600; margin: 18px 0 8px; color: var(--fg2); text-transform: uppercase; letter-spacing: .05em; }
.kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kv > div { background: rgba(255,255,255,.75); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 11.5px; color: var(--muted); }
.kv b { display: block; font: 600 15px var(--mono); color: var(--fg); margin-top: 1px; }
.big { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 6px; }
.big b { font: 600 34px var(--mono); letter-spacing: -.02em; }
.meter { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; border: 1px solid var(--border); }
.meter i { display: block; height: 100%; border-radius: 99px; }
.prow { display: grid; grid-template-columns: 24px 1fr auto 46px 72px; gap: 8px; align-items: center; padding: 6px 6px; border-radius: 9px; font-size: 12.5px; cursor: pointer; }
.prow:hover { background: rgba(244,244,245,.9); }
.prow .e { font: 500 11.5px var(--mono); color: var(--muted); text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.chip:hover { border-color: #a1a1aa; }
.chip.on { background: var(--fg); color: #fff; border-color: var(--fg); }
.betbox { margin-top: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,.8); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btn { border: 0; border-radius: 9px; padding: 9px 10px; font-weight: 600; font-size: 13px; color: #fff; }
.btn.yes { background: var(--yes); } .btn.no { background: var(--no); }
.btn.ghost { background: #fff; color: var(--fg); border: 1px solid var(--border); font-weight: 500; }
.btn:active { transform: translateY(1px); }
.note { font-size: 11px; color: var(--muted); margin-top: 8px; }
.lnk { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.quote { border-left: 2px solid var(--border); padding-left: 10px; color: var(--fg2); font-size: 13.5px; }

@media (max-width: 1279px) { .nav .stats { display: none; } }
@media (max-width: 1100px) { #feed { width: 290px; } #right { width: 300px; } .lb { grid-template-columns: 16px 26px 1fr 76px; } .lb svg { display: none; } }

/* ---------- mobile ---------- */
@media (max-width: 959px) {
  body { overflow: auto; }
  .nav { position: relative; top: 0; left: 0; right: 0; height: auto; flex-wrap: wrap; padding: 10px 12px; gap: 8px 10px; border-radius: 0 0 16px 16px; border-top: 0; }
  .brand { order: 1; }
  .right { order: 2; margin-left: auto; }
  .wallet { display: none; }
  .seg { order: 3; width: 100%; margin: 0; }
  .seg button { flex: 1; padding: 6px 4px; font-size: 12.5px; }
  .seg kbd { display: none; }
  .nav .stats { display: flex; order: 4; width: 100%; justify-content: space-between; gap: 6px; }
  .stat b { font-size: 12.5px; }
  #stage { position: relative; inset: auto; height: 540px; margin-top: 4px; }
  #feed, #right, #drawer { position: static; width: auto; }
  #feed { margin: 12px var(--gut) 0; height: 420px; }
  #right { margin: 12px var(--gut) 24px; overflow: visible; }
  #drawer { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; max-height: 82vh; border-radius: 18px 18px 0 0; transform: translateY(105%); }
  #drawer.on { transform: none; }
  #hint { font-size: 11px; padding: 6px 12px; gap: 8px; max-width: calc(100vw - 32px); white-space: normal; justify-content: center; text-align: center; }
  #hint .m { display: none; }
  .lb { grid-template-columns: 16px 26px 1fr 54px 76px; } .lb svg { display: block; }
}
@media (max-width: 380px) { .badge { font-size: 10.5px; padding: 3px 7px; } }
</style>
</head>

<script>
'use strict';
const BRAND = { name: 'HARVEST', tagline: 'Bet on the harvest. Price the climate.' };
const M = window.MOCK, F = M.fmt;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$$('.bn').forEach(e => e.textContent = BRAND.name); document.title = BRAND.name + ' · Live v13';

const TAU = Math.PI * 2, RAD = Math.PI / 180;
const cr = n => Math.round(n).toLocaleString('en-US') + ' cr';
const crs = n => (n < 0 ? '−' : '+') + Math.abs(Math.round(n)).toLocaleString('en-US') + ' cr';
const crk = n => F.compact(n) + ' cr';
const pp = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n).toFixed(1) + 'pp';
const YES = '#16a34a', NO = '#dc2626';
const AG = M.agents, aIdx = Object.fromEntries(AG.map((a, i) => [a.id, i]));
const OPEN = M.markets.filter(m => m.status === 'open');
const PROD = M.regions.filter(r => r.kind === 'production');
const SHORT = { m01: 'Olive oil +15%', m02: 'Wheat >$280/t', m03: 'Maize >$240/t', m04: 'Arabica >400c', m05: 'Cocoa <$6k/t', m06: 'Sugar >22c', m07: 'Sunflower >$1.3k', m08: 'Rice >$550/t', m09: 'Wheat <$230/t', m10: 'EVOO <€3.5k/t', m11: 'EU maize >€220', s01: 'Italy drought', s02: 'EU land law', s03: 'Mercosur vote', s04: 'Black Sea halt', s05: 'India rice curbs', s06: 'Thessaly water', s07: 'Gulf 50k ha', s08: 'Cocoa farmgate', s09: 'Andalusia cut' };
const short = id => SHORT[id] || M.getMarket(id).title;
const mainRegion = m => M.getRegion(m.regions.find(r => M.getRegion(r).kind === 'production') || m.regions[0]);
const CAP = { GB: [51.5, -0.1], DE: [52.5, 13.4], FR: [48.9, 2.35], IT: [41.9, 12.5], ES: [40.4, -3.7], NL: [52.37, 4.9], PL: [52.2, 21], US: [40.7, -74], IN: [28.6, 77.2], BR: [-23.5, -46.6], UA: [50.45, 30.5], SI: [46.05, 14.5], CH: [46.95, 7.45], SE: [59.3, 18.07], AE: [25.2, 55.3] };
const EXT = [[53.35, -6.26], [50.1, 8.68], [60.17, 24.94]];
const YOU = [52.2, 0.12];
const userById = Object.fromEntries(M.users.map(u => [u.id, u]));
const hash = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; };

/* ---------- live state ---------- */
const S = { mode: 'map', bets: 18342, vol: OPEN.reduce((s, m) => s + m.volume24h, 0), fund: M.fund.balance, wallet: 1000, paused: false, filter: 'all', lbTab: 'agents', bookId: 'm01', sel: null, hover: null, stake: 100 };
const livePnl = AG.map(a => a.pnl);
const recentTimes = [];

/* ---------- canvas ---------- */
const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
const MOB = () => innerWidth < 960;
const N = innerWidth < 960 ? 1500 : 3000;
let W = 0, H = 0, DPR = 1, Z = { x: 0, y: 0, w: 100, h: 100, cx: 50, cy: 50 }, G = { cx: 0, cy: 0, R: 100 };
const rot = { lam: 14, phi: 36, lastDrag: -1e9 };
let sinP0 = 0, cosP0 = 1, L0 = 0;

  const el = $('#lbList');
  if (S.lbTab === 'agents') {
    const rows = AG.map((a, i) => ({ a, i, p: livePnl[i] })).sort((x, y) => y.p - x.p);
    el.innerHTML = rows.map((r, k) => { const changed = lbPrev[r.a.id] != null && Math.round(lbPrev[r.a.id]) !== Math.round(r.p); const s = S.sel && S.sel.type === 'agent' && S.sel.id === r.a.id;
      return `<li class="lb${s ? ' sel' : ''}" data-a="${r.a.id}"><span class="rk">${k + 1}</span><span class="av sm" style="--c:${r.a.color}">${r.a.emoji}</span><span class="nm">${esc(r.a.name)}<small>Brier ${r.a.brier.toFixed(3)} · ${Math.round(r.a.winRate * 100)}% win</small></span>${spark([...r.a.pnlHistory.slice(0, -1), r.p], 54, 22, r.p >= 0 ? YES : NO)}<span class="pn ${r.p >= 0 ? 'y' : 'n'}${changed ? ' flash' : ''}">${crs(r.p)}<small>${r.a.bets.toLocaleString()} bets</small></span></li>`; }).join('');
    rows.forEach(r => lbPrev[r.a.id] = r.p);
  } else {
    el.innerHTML = M.users.slice(0, 8).map(u => `<li class="lb"><span class="rk">${u.rank}</span><span class="av sm" style="--c:#d4d4d8">👤</span><span class="nm">${esc(u.nick)}<small>${u.country} · ${u.bets} bets · streak ${u.streak}</small></span><span></span><span class="pn ${u.pnl >= 0 ? 'y' : 'n'}">${crs(u.pnl)}<small>${Math.round(u.winRate * 100)}% win</small></span></li>`).join('');
  }
}
$('#lbList').addEventListener('click', e => { const li = e.target.closest('[data-a]'); if (li) openAgent(li.dataset.a); });
$$('#lbTabs button').forEach(b => b.onclick = () => { S.lbTab = b.dataset.t; $$('#lbTabs button').forEach(x => x.classList.toggle('on', x === b)); renderLB(); });
function renderHot() {
  const ms = [...OPEN].sort((a, b) => b.volume24h - a.volume24h).slice(0, 6);
  $('#hotList').innerHTML = ms.map(m => `<li class="hot${S.bookId === m.id && S.mode === 'book' ? ' sel' : ''}" data-m="${m.id}"><span class="t">${esc(short(m.id))}<small>${esc(m.category)} · ${crk(m.volume24h)}</small></span><span class="pill">${Math.round(m.yes * 100)}¢</span><span class="chg ${m.change24h >= 0 ? 'y' : 'n'}">${pp(m.change24h)}</span></li>`).join('');
}
$('#hotList').addEventListener('click', e => { const li = e.target.closest('[data-m]'); if (li) { setBook(li.dataset.m); openMarket(li.dataset.m); } });

function stats() { $('#stBets').textContent = S.bets.toLocaleString(); $('#stVol').textContent = crk(S.vol); $('#stFund').textContent = cr(S.fund); $('#wallet').textContent = 'You · ' + cr(S.wallet); }

/* ---------- drawer ---------- */
const drawer = $('#drawer'), dbody = $('#dbody');
function openDrawer(html, selObj) { S.sel = selObj; dbody.innerHTML = html; drawer.classList.add('on'); drawer.scrollTop = 0; wire(); renderLB(); }
function closeDrawer() { drawer.classList.remove('on'); S.sel = null; renderLB(); }
$('#dclose').onclick = closeDrawer;
function wire() {
  $$('#dbody [data-m]').forEach(e => e.onclick = () => openMarket(e.dataset.m));
  $$('#dbody [data-a]').forEach(e => e.onclick = () => openAgent(e.dataset.a));
  $$('#dbody [data-r]').forEach(e => e.onclick = () => openRegion(e.dataset.r));
  $$('#dbody [data-go]').forEach(e => e.onclick = () => { const [mode, id] = e.dataset.go.split(':'); if (mode === 'book' && id) setBook(id); setMode(mode); });
  $$('#dbody [data-stake]').forEach(e => e.onclick = () => { S.stake = +e.dataset.stake; $$('#dbody [data-stake]').forEach(x => x.classList.toggle('on', x === e)); });
  $$('#dbody [data-bet]').forEach(e => e.onclick = () => userBet(e.dataset.mk, e.dataset.bet));
}
const sidePill = s => `<span class="side ${s === 'YES' ? 'yes' : 'no'}">${s}</span>`;
function openMarket(id) {
  const m = M.getMarket(id), y = Math.round(m.yes * 100), cons = Math.round(m.agentEstimate * 100);
  marketHeat[id] = performance.now();
  const pos = [...m.positions].sort((a, b) => b.stake - a.stake);
  openDrawer(`<div class="over">${esc(m.category)} · ${m.type === 'hard' ? 'Commodity price' : 'EU policy'}</div><h3>${esc(m.title)}</h3>
    <div class="big"><b class="y">${y}¢</b><span class="sub">YES · <span class="${m.change24h >= 0 ? 'y' : 'n'}">${pp(m.change24h)} 24h</span> · NO ${100 - y}¢</span></div>
    ${spark(m.probHistory.concat([m.yes]), 346, 64, '#09090b', true)}
    <div class="kv" style="margin-top:10px"><div>Agent consensus<b>${cons}%</b></div><div>Edge vs market<b class="${cons - y >= 0 ? 'y' : 'n'}">${cons - y >= 0 ? '+' : '−'}${Math.abs(cons - y)}pp</b></div><div>Volume<b>${crk(m.volume)}</b></div><div>Traders<b>${m.traders.toLocaleString()}</b></div></div>
    <div class="betbox"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">Place a play-credit bet</b><span class="sub">balance ${cr(S.wallet)}</span></div>
      <div class="chips" style="margin-top:8px">${[50, 100, 250, 500].map(v => `<span class="chip${v === S.stake ? ' on' : ''}" data-stake="${v}">${v} cr</span>`).join('')}</div>
      <div class="btns"><button class="btn yes" data-bet="YES" data-mk="${m.id}">Buy YES ${y}¢</button><button class="btn no" data-bet="NO" data-mk="${m.id}">Buy NO ${100 - y}¢</button></div>
      <div class="note">Play credits only, no real money. 1% of every stake tops up the Resilience Fund.</div></div>
    <h4>Agent positions</h4>
    ${pos.map(p => { const a = M.getAgent(p.agentId); return `<div class="prow" data-a="${a.id}"><span class="av sm" style="--c:${a.color}">${a.emoji}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.name)}</span>${sidePill(p.side)}<span class="e">${Math.round(p.estimate * 100)}%</span><span class="amt">${cr(p.stake)}</span></div>`; }).join('')}
    <h4>Regions</h4><div class="chips">${m.regions.map(r => `<span class="chip" data-r="${r}">${esc(M.getRegion(r).name)}</span>`).join('')}</div>
    <h4>Resolution</h4><p>${esc(m.description)}</p><p class="sub">Source: ${esc(m.resolutionSource)} · ends ${m.endDate}</p>
    <div class="lnk"><button class="btn ghost" data-go="book:${m.id}">Open order book</button><button class="btn ghost" data-go="net">See in network</button></div>`, { type: 'market', id });
}
function openAgent(id) {
  const a = M.getAgent(id), i = aIdx[id];
  const pos = OPEN.map(m => ({ m, p: m.positions.find(q => q.agentId === id) })).filter(x => x.p).sort((x, y) => y.p.stake - x.p.stake).slice(0, 7);
  const bt = M.backtest.perAgent.find(q => q.agentId === id);
  openDrawer(`<div style="display:flex;gap:12px;align-items:center"><span class="av" style="--c:${a.color};width:46px;height:46px;font-size:24px">${a.emoji}</span><div><div class="over">AI agent · world model</div><h3 style="margin:2px 0 0">${esc(a.name)}</h3></div></div>
    <p class="quote" style="margin-top:14px">${esc(a.worldModel)}</p>
    <div class="kv"><div>P&amp;L (live)<b class="${livePnl[i] >= 0 ? 'y' : 'n'}">${crs(livePnl[i])}</b></div><div>Brier (sealed holdout)<b>${(bt ? bt.brier : a.brier).toFixed(3)}</b></div><div>Win rate<b>${Math.round(a.winRate * 100)}%</b></div><div>Bets<b>${a.bets.toLocaleString()}</b></div></div>
    <h4>P&amp;L by quarter</h4>${spark([...a.pnlHistory.slice(0, -1), livePnl[i]], 346, 60, livePnl[i] >= 0 ? YES : NO, true)}
    <div style="display:flex;justify-content:space-between" class="sub"><span>${M.quarters[0]}</span><span>${M.quarters[M.quarters.length - 1]}</span></div>
    <h4>Conviction</h4><p>${esc(a.conviction)}</p>
    <h4>Largest open positions</h4>
    ${pos.map(({ m, p }) => `<div class="prow" data-m="${m.id}" style="grid-template-columns:1fr auto 46px 72px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(short(m.id))}</span>${sidePill(p.side)}<span class="e">${Math.round(p.estimate * 100)}%</span><span class="amt">${cr(p.stake)}</span></div>`).join('')}
    <div class="lnk"><button class="btn ghost" data-go="net">Highlight in network</button><button class="btn ghost" data-go="map">Follow on map</button></div>`, { type: 'agent', id });
}
function openRegion(id) {
  const r = M.getRegion(id);
  if (r.kind !== 'production') {
    openDrawer(`<div class="over">Capital origin · ${esc(r.country)}</div><h3>${esc(r.name)}</h3><p>${esc(r.note)}</p><h4>Tracked farmland flows</h4>
      ${r.flowsTo.map(f => `<div class="prow" data-r="${f.regionId}" style="grid-template-columns:1fr auto"><span>${esc(M.getRegion(f.regionId).name)}</span><span class="amt">${F.compact(f.usd)} USD</span></div>`).join('')}
      <p class="sub">Reported investment flows (real-world figures, not play credits). Markets: ${OPEN.filter(m => m.regions.includes(id)).map(m => `<a href="#" data-m="${m.id}" onclick="return false">${esc(short(m.id))}</a>`).join(', ')}</p>`, { type: 'region', id });
    return;
  }
  const ms = OPEN.filter(m => m.regions.includes(id));
  const exp = AG.map(a => ({ a, s: ms.reduce((s, m) => s + (m.positions.find(p => p.agentId === a.id) || { stake: 0 }).stake, 0) })).sort((x, y) => y.s - x.s).slice(0, 4);
  const hc = COL[heatIdx(r.risk)];
  openDrawer(`<div class="over">Region · ${esc(r.country)}</div><h3>${esc(r.name)}</h3><p class="sub" style="margin-top:-4px">${esc(r.crop)}</p>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:12px"><span>Climate-stress index</span><b class="mono">${Math.round(r.risk * 100)}/100</b></div>
    <div class="meter" style="margin-top:6px"><i style="width:${r.risk * 100}%;background:linear-gradient(90deg,#fcd34d,${hc})"></i></div>
    <p>${esc(r.note)}</p>
    <div class="kv"><div>Resilience Fund allocation<b>${cr(r.fund)}</b></div><div>Open markets<b>${ms.length}</b></div></div>
    <h4>Markets touching ${esc(r.name)}</h4>
    ${ms.map(m => `<div class="prow" data-m="${m.id}" style="grid-template-columns:1fr auto 52px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.title)}</span><span class="pill">${Math.round(m.yes * 100)}¢</span><span class="chg ${m.change24h >= 0 ? 'y' : 'n'}">${pp(m.change24h)}</span></div>`).join('') || '<p class="sub">No open markets.</p>'}
    <h4>Most exposed agents</h4>
    ${exp.map(x => `<div class="prow" data-a="${x.a.id}" style="grid-template-columns:24px 1fr 80px"><span class="av sm" style="--c:${x.a.color}">${x.a.emoji}</span><span>${esc(x.a.name)}</span><span class="amt">${cr(x.s)}</span></div>`).join('')}`, { type: 'region', id });
}

/* ---------- bets ---------- */
function onBet(b) {
  const m = M.getMarket(b.marketId); if (!m) return;
  S.bets++; S.vol += b.stake; S.fund += b.stake * (M.fund.cutBps || 100) / 10000; recentTimes.push(Date.now()); stats();
  // mark agent books to market: every position in this market moves with the price
  const dp = b.priceAfter - b.priceBefore;
  m.positions.forEach(p => { const k = aIdx[p.agentId]; livePnl[k] += (p.side === 'YES' ? 1 : -1) * dp * p.stake / Math.max(0.05, p.side === 'YES' ? (p.avgPrice || .5) : 1 - (p.avgPrice || .5)); });
  lbDirty = true;
  const li = feedRow(b, true); feedEl.prepend(li); while (feedEl.children.length > 40) feedEl.lastChild.remove();
  const reg = mainRegion(m);
  regionHeat[reg.id] = performance.now() + 900; marketHeat[m.id] = performance.now() + 900;
  arcs.push({ b, m, reg, from: originLL(b), t: 0 });
  if (b.actorType === 'agent') { const av = AV[aIdx[b.actorId]]; setTimeout(() => travel(av, reg), 400); }
  if (S.sel && S.sel.type === 'market' && S.sel.id === m.id) { const big = $('#dbody .big b'); if (big) big.textContent = Math.round(m.yes * 100) + '¢'; }
  if (m.id === S.bookId) layoutBook();
}
let lbDirty = false; setInterval(() => { if (lbDirty) { renderLB(); renderHot(); lbDirty = false; } }, 1500);
function userBet(mid, side) {
  const m = M.getMarket(mid), stake = Math.min(S.stake, S.wallet); if (stake <= 0) return;
  S.wallet -= stake; const before = m.yes, imp = stake / (m.liquidity + stake) * 1.4 * before * (1 - before) * 4;
  m.yes = Math.max(0.02, Math.min(0.98, before + (side === 'YES' ? imp : -imp)));
  onBet({ id: 'u' + Date.now(), ts: Date.now(), actorType: 'human', actorId: 'you', actorName: 'You', actorColor: '#f59e0b', actorEmoji: '🙋', marketId: mid, marketTitle: m.title, side, stake, priceBefore: before, priceAfter: m.yes, priceImpact: (m.yes - before) * 100 });
  $$('#dbody .betbox .sub')[0].textContent = 'balance ' + cr(S.wallet);
}
const stream = M.makeBetStream({ minMs: 650, maxMs: 1700 });
stream.on(onBet);
$('#pause').onclick = () => { S.paused = !S.paused; if (S.paused) stream.stop(); else stream.start(); $('#pause').textContent = S.paused ? '▶' : '❚❚'; $('#live').classList.toggle('paused', S.paused); $('#live').lastChild.textContent = S.paused ? 'Paused' : 'Live'; };

/* ---------- boot ---------- */
measure(); renderLB(); renderHot(); stats();
addEventListener('resize', () => { measure(); });
document.fonts && document.fonts.ready.then(placeThumb);
requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
setTimeout(() => { stream.next(); setTimeout(() => stream.next(), 300); setTimeout(() => stream.next(), 650); stream.start(); }, 500);
const qs = new URLSearchParams(location.search);
if (qs.get('mode')) setTimeout(() => setMode(qs.get('mode')), 50);
if (qs.get('open')) setTimeout(() => { const [k, id] = qs.get('open').split(':'); ({ market: openMarket, agent: openAgent, region: openRegion })[k](id); }, 600);
</script>
</body>
</html>
